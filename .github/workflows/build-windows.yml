# Builds a Windows Ship of Harkinian with the TrifoolPercent module, plus TrifoolPercent.o2r, and uploads both as
# one artifact. Download the "TrifoolPercent-windows" artifact from the run, unzip it into an empty folder, and run
# soh.exe; on first launch it asks for your own OoT ROM to make oot.o2r. TrifoolPercent.o2r is already in mods/.
#
# Shipwright and its submodules are fetched by tools/setup.sh (shallow by SHA). actions/checkout's own submodules:
# true doesn't work: the pinned Shipwright's libultraship branch tip has moved on since and the fetch fails on
# "not our ref".
name: build-windows
on:
  push:
    paths:
      - "soh/**"
      - "scenes/**"
      - "actors/**"
      - "tools/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  SHIPWRIGHT_COMMIT: 6b4edce43f949fea554bc029daed42dd9b04569a

jobs:
  # soh.o2r (the port's own assets) and TrifoolPercent.o2r are both built on Linux.
  build-o2r:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TrifoolPercent
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch Triforce%, Fast64 and Shipwright
        run: tools/setup.sh
      - name: Install SoH build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat third_party/Shipwright/linux-build-deps/apt.txt)
      - name: Generate soh.o2r
        working-directory: third_party/Shipwright
        run: |
          cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DSOH_TOOLS_ONLY=ON
          cmake --build build-cmake --config Release --target GenerateSohOtr -j4
      - name: Build TrifoolPercent.o2r
        run: tools/build_o2r.sh
      - name: Upload o2r files
        uses: actions/upload-artifact@v4
        with:
          name: o2r
          path: |
            third_party/Shipwright/soh.o2r
            build/TrifoolPercent.o2r
          retention-days: 3

  build-windows:
    needs: build-o2r
    runs-on: windows-latest
    steps:
      - name: Install dependencies
        run: choco install ninja -y
      - name: Checkout TrifoolPercent
        uses: actions/checkout@v4
      - name: Clone Shipwright
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/HarbourMasters/Shipwright Shipwright
          git -C Shipwright checkout ${{ env.SHIPWRIGHT_COMMIT }}
          git -C Shipwright submodule update --init --depth 1 libultraship torch
      - name: Add the TrifoolPercent module
        shell: pwsh
        run: Copy-Item -Recurse soh/Enhancements/TrifoolPercent Shipwright/soh/soh/Enhancements/TrifoolPercent
      - name: Restore cached vcpkg folder
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-vcpkg-${{ env.SHIPWRIGHT_COMMIT }}
          restore-keys: ${{ runner.os }}-vcpkg-
          path: Shipwright/vcpkg
      - name: Configure Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64
      - name: Download o2r files
        uses: actions/download-artifact@v4
        with:
          name: o2r
          path: o2r
      - name: Build SoH
        working-directory: Shipwright
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/Shipwright/vcpkg
        run: |
          New-Item -ItemType Directory -Force build-windows/soh | Out-Null
          Copy-Item ../o2r/third_party/Shipwright/soh.o2r build-windows/soh/soh.o2r
          cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release
          cmake --build build-windows --config Release --parallel 4
          cd build-windows
          cpack
      - name: Assemble the package
        shell: pwsh
        run: |
          $zip = Get-ChildItem Shipwright/_packages/*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath TrifoolPercent-windows
          New-Item -ItemType Directory -Force TrifoolPercent-windows/mods | Out-Null
          Copy-Item o2r/build/TrifoolPercent.o2r TrifoolPercent-windows/mods/
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TrifoolPercent-windows
          path: TrifoolPercent-windows
