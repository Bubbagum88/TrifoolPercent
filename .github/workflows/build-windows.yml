# Builds the Windows TrifoolPercent package end to end.
#
# The pipeline has two stages. Each one is one job, and each job's steps read top-to-bottom like a recipe.
#
#   1) assets  (Linux)   builds the two archives SoH needs:
#                          - soh.o2r              the base game assets, built from Shipwright
#                          - TrifoolPercent.o2r   the Triforce Room scene and models
#                        the archives are uploaded as the "o2r" artifact so stage 2 can grab them.
#
#   2) windows (Windows) builds soh.exe with the TrifoolPercent module compiled in, downloads the "o2r"
#                        artifact from stage 1, and bundles everything (soh.exe, soh.o2r, mods/TrifoolPercent.o2r)
#                        into one ZIP uploaded as the "TrifoolPercent-windows" artifact.
#
# To use the result: open the completed run on GitHub -> scroll to "Artifacts" -> download
# "TrifoolPercent-windows", unzip into an empty folder, and run soh.exe. First launch asks for an OoT ROM to
# make oot.o2r. TrifoolPercent.o2r is already in mods/.
#
# When a build fails, open the run, click the red job, and look for the first red step. Each step's name says
# what it is doing, so the first red one tells you where to look.
name: build-windows

on:
  push:
    paths:
      - "soh/**"
      - "scenes/**"
      - "actors/**"
      - "tools/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Shipwright commit to build against. Must match tools/setup.sh.
  SHIPWRIGHT_COMMIT: 6b4edce43f949fea554bc029daed42dd9b04569a

jobs:

  # Stage 1: build the two .o2r asset archives on Linux (quicker and lighter than Windows).
  assets:
    name: Stage 1 - Build asset archives (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out TrifoolPercent
        uses: actions/checkout@v4

      - name: Install Python 3.13 (for Blender's bpy and the asset scripts)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pillow (needed by the title-card renderer)
        run: pip install pillow

      - name: Fetch upstream sources (Triforce%, HM Fast64, Shipwright + submodules)
        # tools/setup.sh pins and clones everything; it uses --depth 1 so moved submodule branches don't matter.
        run: tools/setup.sh

      - name: Install Shipwright's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat third_party/Shipwright/linux-build-deps/apt.txt)

      - name: Build soh.o2r (the base game assets, from Shipwright)
        working-directory: third_party/Shipwright
        run: |
          cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja \
                -DCMAKE_BUILD_TYPE:STRING=Release -DSOH_TOOLS_ONLY=ON
          cmake --build build-cmake --config Release --target GenerateSohOtr -j4

      - name: Build TrifoolPercent.o2r (the Triforce Room scene and models)
        run: tools/build_o2r.sh

      - name: Upload both archives as the "o2r" artifact
        uses: actions/upload-artifact@v4
        with:
          name: o2r
          path: |
            third_party/Shipwright/soh.o2r
            build/TrifoolPercent.o2r
          retention-days: 3

  # Stage 2: build soh.exe with the TrifoolPercent module on Windows, bundle it with the two .o2r files.
  windows:
    name: Stage 2 - Build soh.exe and package (Windows)
    needs: assets
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Install Ninja (SoH's build system)
        run: choco install ninja -y

      - name: Check out TrifoolPercent
        uses: actions/checkout@v4

      - name: Clone Shipwright and fetch its submodules
        # Done by hand (not via actions/checkout submodules: true) so we can shallow-fetch the pinned SHA
        # for libultraship and torch: their branch tips have moved and a full fetch would fail with
        # "not our ref". --depth 1 fetches exactly the SHA Shipwright is pinned to.
        run: |
          git clone --filter=blob:none https://github.com/HarbourMasters/Shipwright Shipwright
          git -C Shipwright checkout ${{ env.SHIPWRIGHT_COMMIT }}
          git -C Shipwright submodule update --init --depth 1 libultraship torch

      - name: Copy the TrifoolPercent module into Shipwright
        # Shipwright's CMake globs soh/soh/**, so dropping the folder in is enough to get it compiled.
        run: Copy-Item -Recurse soh/Enhancements/TrifoolPercent Shipwright/soh/soh/Enhancements/TrifoolPercent

      - name: Restore cached vcpkg folder (speeds up repeat builds)
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-vcpkg-${{ env.SHIPWRIGHT_COMMIT }}
          restore-keys: ${{ runner.os }}-vcpkg-
          path: Shipwright/vcpkg

      - name: Set up the MSVC x64 developer environment
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64

      - name: Download the "o2r" artifact from Stage 1
        uses: actions/download-artifact@v4
        with:
          name: o2r
          path: o2r

      - name: Place soh.o2r where Shipwright's build expects it
        run: |
          New-Item -ItemType Directory -Force Shipwright/build-windows/soh | Out-Null
          Copy-Item o2r/third_party/Shipwright/soh.o2r Shipwright/build-windows/soh/soh.o2r

      - name: Configure Shipwright with CMake
        working-directory: Shipwright
        env:
          VCPKG_ROOT: ${{ github.workspace }}/Shipwright/vcpkg
        run: cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release

      - name: Compile Shipwright (soh.exe + the TrifoolPercent module)
        working-directory: Shipwright
        env:
          VCPKG_ROOT: ${{ github.workspace }}/Shipwright/vcpkg
        run: cmake --build build-windows --config Release --parallel 4

      - name: Package Shipwright with CPack (produces a .zip)
        working-directory: Shipwright/build-windows
        run: cpack

      - name: Unpack CPack's zip into TrifoolPercent-windows/
        run: |
          $zip = Get-ChildItem Shipwright/_packages/*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath TrifoolPercent-windows

      - name: Drop TrifoolPercent.o2r into TrifoolPercent-windows/mods/
        run: |
          New-Item -ItemType Directory -Force TrifoolPercent-windows/mods | Out-Null
          Copy-Item o2r/build/TrifoolPercent.o2r TrifoolPercent-windows/mods/

      - name: Upload "TrifoolPercent-windows" (the whole ready-to-run package)
        uses: actions/upload-artifact@v4
        with:
          name: TrifoolPercent-windows
          path: TrifoolPercent-windows
