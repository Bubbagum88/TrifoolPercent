# Builds the full Ship of Harkinian engine with the TrifoolPercent module compiled in, together with
# the mod .o2r. Downstream users only need the `.o2r` on top of a stock SoH install (that is what
# build-o2r.yml ships); this workflow is for when the module itself changes and we want a ready-to-run
# soh.elf + TrifoolPercent.o2r pair to hand around.
#
# Steps read top-to-bottom like a recipe. When a build fails, open the run, click the red job, and
# the first red step's name says where to look.
#
# To use the result: open the completed run on GitHub -> scroll to "Artifacts" -> download
# "TrifoolPercent-soh-linux" -> extract -> run `./soh.elf` (first launch extracts oot.o2r from your
# own ROM, same as a stock SoH install).
name: build-soh

on:
  push:
    branches: [main]
    paths:
      - "soh/**"
      - "scenes/**"
      - "actors/**"
      - "tools/**"
      - ".github/workflows/build-soh.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build soh.elf + TrifoolPercent.o2r
    runs-on: ubuntu-24.04
    # Linux build. The build-soh-windows job below produces the equivalent soh.exe drop
    # for dropping into C:\Harbour Masters 64\TrifoolPercent test\.
    steps:
      - name: Check out TrifoolPercent
        uses: actions/checkout@v4

      - name: Install Python 3.13 (for Blender's bpy and the asset scripts)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pillow (needed by the title-card renderer)
        run: pip install pillow

      - name: Fetch upstream sources (Triforce%, HM Fast64, Shipwright + submodules)
        # tools/setup.sh pins and clones everything; it uses --depth 1 so moved submodule branches
        # don't matter. Shipwright is both the engine and the Torch toolchain host.
        run: tools/setup.sh

      - name: Install Shipwright's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat third_party/Shipwright/linux-build-deps/apt.txt)

      - name: Build Shipwright's asset tools (needed to produce the mod .o2r)
        working-directory: third_party/Shipwright
        run: |
          cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja \
                -DCMAKE_BUILD_TYPE:STRING=Release -DSOH_TOOLS_ONLY=ON
          cmake --build build-cmake --config Release --target GenerateSohOtr -j4

      - name: Build TrifoolPercent.o2r (the Triforce Room, Unicorn Fountain and Test Room scenes)
        run: tools/build_o2r.sh

      - name: Cache the Shipwright engine build (reused when the Shipwright pin, build recipe, and engine patches are all unchanged)
        # The engine build is the slow part of this workflow (tens of minutes); the mod .o2r pack
        # above is fast and runs every time. The cache stores the finished build tree, including
        # engine object files, so a cache hit lets ninja skip rebuilding the engine and only
        # recompile the TrifoolPercent module (incremental build after we re-copy it in below).
        # Inputs to the key - deliberately NOT including TrifoolPercent source, so edits to our
        # module get a cache hit on the engine objects and only re-link:
        #   tools/setup.sh         - pins SHIPWRIGHT_COMMIT (bump invalidates cache)
        #   tools/build_soh.sh     - the build recipe itself
        #   patches/shipwright/**  - engine patches applied before cmake
        id: cache-soh-build
        uses: actions/cache@v4
        with:
          path: third_party/Shipwright/build
          key: soh-build-${{ runner.os }}-${{ hashFiles('tools/setup.sh', 'tools/build_soh.sh', 'patches/shipwright/**') }}

      - name: Build the full Ship of Harkinian engine with the TrifoolPercent module
        # tools/build_soh.sh copies soh/Enhancements/TrifoolPercent/ into Shipwright's tree and runs
        # a Release cmake build. Shipwright globs soh/soh/** so no build-file edits are needed.
        # Always runs: the cache above restores the engine build tree so ninja can skip unchanged
        # engine objects and only recompile the TrifoolPercent module (incremental build).
        run: tools/build_soh.sh

      - name: Stage the drop (soh.elf + TrifoolPercent.o2r + a README)
        run: |
          STAGE="build/soh-drop"
          mkdir -p "$STAGE/mods"
          cp third_party/Shipwright/build/soh/soh.elf "$STAGE/soh.elf"
          cp build/TrifoolPercent.o2r "$STAGE/mods/TrifoolPercent.o2r"
          cat > "$STAGE/README.txt" <<'EOF'
          TrifoolPercent build for Ship of Harkinian (Linux).

          Files in this archive:
            soh.elf                   The engine with the TrifoolPercent module compiled in.
            mods/TrifoolPercent.o2r   The scenes (Triforce Room, Unicorn Fountain, hex Test Room)
                                      and actor models. soh.elf picks it up automatically from mods/.

          Running it:
            1. Put your Ocarina of Time 1.0 ROM in the folder next to soh.elf on first launch;
               soh.elf extracts oot.o2r from it, same as a stock SoH install.
            2. ./soh.elf
            3. Enable the TrifoolPercent menu entries under Enhancements -> TrifoolPercent.
          EOF

      - name: Upload the TrifoolPercent + soh.elf drop
        uses: actions/upload-artifact@v4
        with:
          name: TrifoolPercent-soh-linux
          path: build/soh-drop
          retention-days: 30

  build-soh-windows:
    name: Build soh.exe + TrifoolPercent.o2r (Windows)
    runs-on: windows-2022
    # Windows counterpart to the Linux build above. Produces soh.exe so a run can be
    # dropped into C:\Harbour Masters 64\TrifoolPercent test\ without a local build.
    # Shipwright is built with MSVC (Visual Studio 17 2022). The .o2r asset pipeline
    # (bpy/Fast64, Torch) is Linux-only in this repo, so this job depends on the Linux
    # `build` job above and reuses its TrifoolPercent.o2r instead of rebuilding it.
    needs: build
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out TrifoolPercent
        uses: actions/checkout@v4

      - name: Fetch Shipwright and its submodules (no Fast64/bpy needed on Windows)
        run: |
          mkdir -p third_party
          SHIPWRIGHT_COMMIT=$(grep -E '^SHIPWRIGHT_COMMIT=' tools/setup.sh | head -1 | cut -d= -f2 | awk '{print $1}')
          git clone --filter=blob:none https://github.com/HarbourMasters/Shipwright third_party/Shipwright
          git -C third_party/Shipwright checkout --quiet "$SHIPWRIGHT_COMMIT"
          git -C third_party/Shipwright submodule update --init --depth 1

      - name: Download TrifoolPercent.o2r built by the Linux job
        uses: actions/download-artifact@v4
        with:
          name: TrifoolPercent-soh-linux
          path: build/linux-drop

      - name: Cache the Shipwright engine build (reused when the Shipwright pin, workflow recipe, and engine patches are all unchanged)
        id: cache-soh-build-windows
        uses: actions/cache@v4
        with:
          path: third_party/Shipwright/build
          # Separate key from the Linux cache: a Windows build tree isn't interchangeable.
          # The build-cmake tools tree lives beside it and is cheap enough to rebuild.
          # Deliberately NOT keyed on TrifoolPercent source - edits to our module get a cache
          # hit on the engine objects and only trigger an incremental rebuild of our files.
          key: soh-build-${{ runner.os }}-${{ hashFiles('tools/setup.sh', '.github/workflows/build-soh.yml', 'patches/shipwright/**') }}

      - name: Prep Shipwright (copy module, apply engine patches)
        # Mirrors the prep in tools/build_soh.sh. Uses Git Bash's `patch` (lenient enough
        # for the existing hand-maintained patches); `git apply` on Windows rejects them.
        # Always runs so TrifoolPercent edits land in the Shipwright tree; the MSVC step below
        # relies on the restored build/ cache for incremental compilation of unchanged engine code.
        run: |
          SOH=third_party/Shipwright
          git -C "$SOH" reset --hard HEAD >/dev/null
          rm -rf "$SOH/soh/soh/Enhancements/TrifoolPercent"
          cp -r soh/Enhancements/TrifoolPercent "$SOH/soh/soh/Enhancements/TrifoolPercent"
          if compgen -G "patches/shipwright/*.patch" > /dev/null; then
            for p in patches/shipwright/*.patch; do
              echo "Applying $(basename "$p") to Shipwright..."
              patch -d "$SOH" -p1 < "$p"
            done
          fi

      - name: Configure and build soh.exe (MSVC Visual Studio 17 2022, x64 Release)
        # Always runs; MSVC's incremental build reuses engine objects from the restored cache
        # and only recompiles the TrifoolPercent module (and relinks).
        shell: pwsh
        run: |
          cmake -S third_party/Shipwright -B third_party/Shipwright/build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build third_party/Shipwright/build --config Release -j
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage the drop (soh.exe + TrifoolPercent.o2r + a README)
        run: |
          STAGE="build/soh-drop-windows"
          mkdir -p "$STAGE/mods"
          cp third_party/Shipwright/build/soh/Release/soh.exe "$STAGE/soh.exe"
          # Shipwright drops a handful of DLLs (SDL2, etc.) next to soh.exe at build time;
          # copy any that landed in the Release folder so the drop is self-contained.
          find third_party/Shipwright/build/soh/Release -maxdepth 1 -name '*.dll' -exec cp {} "$STAGE/" \;
          # Reuse the .o2r built by the Linux job (asset pipeline is Linux-only).
          cp build/linux-drop/mods/TrifoolPercent.o2r "$STAGE/mods/TrifoolPercent.o2r"
          cat > "$STAGE/README.txt" <<'EOF'
          TrifoolPercent build for Ship of Harkinian (Windows).

          Files in this archive:
            soh.exe                   The engine with the TrifoolPercent module compiled in.
            *.dll                     SDL2 and friends; keep them next to soh.exe.
            mods/TrifoolPercent.o2r   The scenes (Triforce Room, Unicorn Fountain, hex Test Room)
                                      and actor models. soh.exe picks it up automatically from mods/.

          Running it:
            1. Drop this folder's contents into C:\Harbour Masters 64\TrifoolPercent test\
               (or any folder with your Ocarina of Time 1.0 ROM for first-launch oot.o2r extraction).
            2. Run soh.exe.
            3. Enable the TrifoolPercent menu entries under Enhancements -> TrifoolPercent.
          EOF

      - name: Upload the TrifoolPercent + soh.exe drop
        uses: actions/upload-artifact@v4
        with:
          name: TrifoolPercent-soh-windows
          path: build/soh-drop-windows
          retention-days: 30
